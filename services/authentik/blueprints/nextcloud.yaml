# Nextcloud's "Log in with SussyNet": an OIDC provider and application that only
# members of the "nextcloud" and "admin-nextcloud" groups can use. Add people
# in the admin interface (Directory > Groups). Their first login creates their
# Nextcloud account, named after their Authentik username.
#
# Members of "admin-nextcloud" are Nextcloud admins: the nextcloud_groups claim
# below puts them in Nextcloud's "admin" group, and Nextcloud takes them out of
# it at their next login once they leave "admin-nextcloud". It doesn't make
# them Authentik admins.
#
# The client secret is generated on the server (services/authentik/default.nix,
# nextcloud-oidc-secret) and reaches this file through the worker's
# environment, so it never appears in the repo.
version: 1
metadata:
  name: SussyNet Nextcloud
entries:
  - model: authentik_core.group
    id: group
    identifiers:
      name: nextcloud
    attrs:
      is_superuser: false

  - model: authentik_core.group
    id: admin-nextcloud
    identifiers:
      name: admin-nextcloud
    attrs:
      is_superuser: false

  # Nextcloud (user_oidc) syncs the user's groups from this claim, but only
  # "admin" (its --group-whitelist-regex), so groups made in Nextcloud are left
  # alone. Always a list, even empty: a missing claim would skip the sync and
  # leave an old admin in the group.
  - model: authentik_providers_oauth2.scopemapping
    id: groups-mapping
    identifiers:
      name: "SussyNet Nextcloud: groups"
    attrs:
      scope_name: nextcloud
      description: Nextcloud admin rights
      expression: |
        if ak_is_group_member(request.user, name="admin-nextcloud"):
            return {"nextcloud_groups": ["admin"]}
        return {"nextcloud_groups": []}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Nextcloud
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: nextcloud
      client_secret: !Env NEXTCLOUD_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
      # with and without index.php, depending on whether Nextcloud thinks
      # pretty URLs work
      redirect_uris:
        - matching_mode: strict
          url: https://fs.parkalex.dev/apps/user_oidc/code
          redirect_uri_type: authorization
        - matching_mode: strict
          url: https://fs.parkalex.dev/index.php/apps/user_oidc/code
          redirect_uri_type: authorization
      # user_oidc reads the claims from the ID token
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf groups-mapping
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: nextcloud
    attrs:
      name: Nextcloud
      provider: !KeyOf provider
      meta_launch_url: https://fs.parkalex.dev
      meta_description: Files
      policy_engine_mode: any

  # Without bindings every user could use it; with these, only the two groups
  # (policy_engine_mode any: either one is enough)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !KeyOf group
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !KeyOf admin-nextcloud
      order: 10
  # The shared "admins" group had access before admin-nextcloud replaced it
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, admins]]
      order: 10
    state: absent
