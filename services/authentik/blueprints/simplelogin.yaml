# SimpleLogin's "Log in with SSO": an OIDC provider and application that only
# members of the "simplelogin" and "admin-simplelogin" groups can use. Add
# people in the admin interface (Directory > Groups). Their first login creates
# their SimpleLogin account, with their Authentik email as its mailbox. Members
# of "admin-simplelogin" are also SimpleLogin admins, updated on each SSO login
# (services/simplelogin/build/patch-oidc.py). It gives no rights in Authentik.
#
# The client secret is generated on the server (services/authentik/default.nix,
# simplelogin-oidc-secret) and reaches this file through the worker's
# environment, so it never appears in the repo.
version: 1
metadata:
  name: SussyNet SimpleLogin
entries:
  - model: authentik_core.group
    id: group
    identifiers:
      name: simplelogin
    attrs:
      is_superuser: false

  - model: authentik_core.group
    id: admin-simplelogin
    identifiers:
      name: admin-simplelogin
    attrs:
      # SimpleLogin admin only, never Authentik admin
      is_superuser: false

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: SimpleLogin
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: simplelogin
      client_secret: !Env SIMPLELOGIN_OIDC_CLIENT_SECRET
      # SimpleLogin only uses the authorization code flow
      grant_types:
        - authorization_code
      redirect_uris:
        - matching_mode: strict
          url: https://m.sus.cx/auth/oidc/callback
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: simplelogin
    attrs:
      name: SimpleLogin
      provider: !KeyOf provider
      meta_launch_url: https://m.sus.cx
      meta_description: Email aliases
      policy_engine_mode: any

  # Without bindings every user could use it; with these, only the two groups
  # (policy_engine_mode any: either one is enough)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !KeyOf group
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !KeyOf admin-simplelogin
      order: 10

  # The first version let the general "admins" group in (it now belongs to
  # Nextcloud, services/authentik/blueprints/nextcloud.yaml); remove only that
  # binding, not the group
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !Find [authentik_core.group, [name, admins]]
      order: 10
    conditions:
      - !Find [authentik_core.group, [name, admins]]
    state: absent
